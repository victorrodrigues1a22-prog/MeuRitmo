<dialog id="taskDialog"><form id="taskForm"><div class="modal-head"><h2 id="dialogTitle">Nova atividade</h2><button type="button" class="icon-btn" id="closeDialog" aria-label="Fechar">×</button></div><div class="modal-body"><input type="hidden" id="taskId"><div class="form-grid"><div class="field full"><label for="titleInput">O que você precisa fazer?</label><input id="titleInput" maxlength="100" required placeholder="Ex.: Revisar pré-natal de baixo risco"></div><div class="field"><label for="dateInput">Data</label><input type="date" id="dateInput" required></div><div class="field"><label for="timeInput">Horário</label><input type="time" id="timeInput"></div><div class="field"><label for="categoryInput">Categoria</label><select id="categoryInput"><option>Estudo</option><option>Internato</option><option>Pessoal</option><option>Revisão</option></select></div><div class="field"><label for="priorityInput">Prioridade</label><select id="priorityInput"><option>Normal</option><option>Importante</option><option>Urgente</option></select></div><div class="field full"><label for="notesInput">Anotações (opcional)</label><textarea id="notesInput" placeholder="Material, objetivo ou lembrete..."></textarea></div></div><div class="modal-actions"><button class="delete-btn" type="button" id="deleteTask" hidden>Excluir atividade</button><button class="primary" type="submit">Salvar atividade</button></div></div></form></dialog>
